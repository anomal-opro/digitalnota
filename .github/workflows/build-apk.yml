name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Patch Capacitor Gradle Files for AGP 8.13
        run: node scripts/patch-capacitor-gradle.cjs

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log || {
            echo "::error::Gradle build failed!"
            echo "========== ERROR SUMMARY =========="
            grep -i -C 2 -E "(error:|fatal:|cannot find symbol|cannot override|weaker access|FAILURE:)" ../build.log | head -n 60 || tail -n 60 ../build.log
            echo "===================================="
            exit 1
          }
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx2g"

      - name: Prepare APK Output
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NotaDigital-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotaDigital-v1.0-APK
          path: NotaDigital-v1.0.apk
          retention-days: 30
